name: iOS Simulator Build

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Patch Podfile for Firebase
        working-directory: ./app
        run: |
          rm -f ios/Podfile
          flutter build ios --config-only --simulator --no-codesign || true
          ruby -i -pe 'gsub(/use_frameworks!/, "use_frameworks! :linkage => :static\n  use_modular_headers!")' ios/Podfile
          ruby -i -pe 'gsub(/flutter_additional_ios_build_settings\(target\)/, "flutter_additional_ios_build_settings(target)\n      target.build_configurations.each do |config|\n        config.build_settings[\"ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES\"] = \"YES\"\n      end")' ios/Podfile
          cat ios/Podfile

      - name: Build iOS Simulator App
        working-directory: ./app
        run: flutter build ios --simulator --no-codesign

      - name: Compress Simulator App
        working-directory: ./app
        run: |
          cd build/ios/iphonesimulator
          zip -r Runner.app.zip Runner.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: app/build/ios/iphonesimulator/Runner.app.zip
          retention-days: 7
