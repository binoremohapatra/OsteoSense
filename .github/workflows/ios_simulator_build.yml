name: iOS Simulator Build

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Patch Podfile for Firebase
        working-directory: ./app
        run: |
          rm -f ios/Podfile
          flutter build ios --config-only --simulator --no-codesign || true
          sed -i -e 's/use_frameworks!/use_frameworks! :linkage => :static/' ios/Podfile

      - name: Build iOS Simulator App
        working-directory: ./app
        run: flutter build ios --simulator --no-codesign

      - name: Compress Simulator App
        working-directory: ./app
        run: |
          cd build/ios/iphonesimulator
          zip -r Runner.app.zip Runner.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: app/build/ios/iphonesimulator/Runner.app.zip
          retention-days: 7
