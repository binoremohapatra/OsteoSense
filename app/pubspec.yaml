name: joint_saathi
description: AI-assisted early detection app for Osteoarthritis risk screening for healthcare workers in rural/remote NER of India.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Routing
  go_router: ^13.0.0

  # Local Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # Network
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # AI/ML
  tflite_flutter: ^0.12.1

  # Sensors
  sensors_plus: ^4.0.2

  # BLE
  flutter_blue_plus: ^1.31.5

  # Charts
  fl_chart: ^0.66.0

  # PDF
  pdf: ^3.10.7
  printing: ^5.11.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  easy_localization: ^3.0.7

  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10

  # Images
  cached_network_image: ^3.3.0

  # UI / Animation
  google_fonts: ^6.1.0
  lottie: ^3.0.0
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  flutter_svg: ^2.0.9
  smooth_page_indicator: ^1.1.0

  # Maps
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.3
  geocoding: ^2.1.0

  # Storage
  shared_preferences: ^2.2.2
  share_plus: ^7.2.1

  # Icons & Splash
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.9

  # UI Utilities
  cupertino_icons: ^1.0.6
  permission_handler: ^11.1.0
  animations: ^3.0.0
  confetti: ^0.7.0
  path_provider: any
  percent_indicator: ^4.2.1
  material_palette: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/models/
    - assets/images/JointSaathi_dotted_particle_background.gif
    - assets/translations/


# ============================================================
# APP ICON
# ============================================================

flutter_launcher_icons:
  android: true
  ios: false

  # Square JointSaathi logo
  image_path: "assets/icons/app_icon.png"

  min_sdk_android: 21

  # Green square/adaptive icon background
  adaptive_icon_background: "#388E3C"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

  web:
    generate: false


# ============================================================
# SPLASH SCREEN
# ============================================================

flutter_native_splash:

  # Pure white — matches logo background exactly (#FFFFFF)
  color: "#FFFFFF"

  # JointSaathi logo centered — shown as-is (rounded square, no circular clip)
  image: assets/icons/splash_icon.png

  # Dark mode — matches AppColors.backgroundDark (#0F1512)
  color_dark: "#0F1512"
  image_dark: assets/icons/splash_icon.png

  android: true
  ios: false

  android_12:
    # Pure white background — matches logo
    color: "#FFFFFF"
    color_dark: "#0F1512"
    image: assets/icons/splash_icon_android12.png
    image_dark: assets/icons/splash_icon_android12.png